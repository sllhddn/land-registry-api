services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: landregistry
      POSTGRES_USER: landregistry
      POSTGRES_PASSWORD: landregistry
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landregistry"]
      interval: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/landregistry
      DB_USER: landregistry
      DB_PASSWORD: landregistry
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
