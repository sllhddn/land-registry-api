name: CI
on: [push, pull_request]
jobs:
  lint-migrations:
    # Lint Flyway migrations with sql-patch-guard (https://github.com/sllhddn/sql-patch-guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/sllhddn/sql-patch-guard.git
      - run: sql-patch-guard src/main/resources/db/migration/*.sql

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit + integration tests (H2)
        run: mvn -B verify

  postgres-schema-check:
    # Start the real app against real PostgreSQL: Flyway migrates, then Hibernate validates the entities.
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: landregistry
          POSTGRES_USER: landregistry
          POSTGRES_PASSWORD: landregistry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U landregistry" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -q package -DskipTests
      - name: Boot against PostgreSQL and smoke test the API
        run: |
          java -jar target/land-registry-api-*.jar &
          for i in $(seq 1 30); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
          curl -sf -X POST localhost:8080/api/parcels -H 'Content-Type: application/json' \
            -d '{"lotNo":"LOT-1","district":"District A","areaSqm":1250.5,"tenure":"FREEHOLD"}'
          curl -sf localhost:8080/api/parcels
