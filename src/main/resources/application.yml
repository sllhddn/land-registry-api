spring:
  application:
    name: land-registry-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/landregistry}
    username: ${DB_USER:landregistry}
    password: ${DB_PASSWORD:landregistry}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
